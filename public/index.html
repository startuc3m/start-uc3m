<!DOCTYPE html>
<html lang="es">
  <head>

    <link rel="canonical" href="https://www.startuc3m.es/" />

    <!-- Iconos: apuntan solo a ficheros que existen en /public -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph: lo que leen WhatsApp, LinkedIn, Slack... al compartir el enlace.

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Start UC3M" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://www.startuc3m.es/" />
    <meta property="og:title" content="Start UC3M | Asociación de emprendedores de la UC3M" />
    <meta
      property="og:description"
      content="Eventos, comunidad y proyectos para pasar de la idea a algo real. La asociación de emprendedores de la Universidad Carlos III de Madrid."
    />
    <meta property="og:image" content="https://www.startuc3m.es/Logo.png" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Logo de Start UC3M" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Start UC3M | Asociación de emprendedores de la UC3M" />

      name="twitter:description"
      content="Eventos, comunidad y proyectos para pasar de la idea a algo real. La asociación de emprendedores de la Universidad Carlos III de Madrid."
    />

    <noscript>
      Start UC3M es la asociación de emprendedores de la Universidad Carlos III de Madrid.

    <div id="root"></div>

</html>
